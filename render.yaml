# Render Blueprint for Sino: one Node web service that serves the built app
# and /api from a single HTTPS origin, plus a managed PostgreSQL database.
# Secrets are never stored here: DATABASE_URL comes from the database itself.
services:
  - type: web
    name: sino
    runtime: node
    plan: free
    region: frankfurt
    rootDir: hazii
    buildCommand: npm ci --include=dev && npm run build
    # Free plan has no pre-deploy step, so idempotent migrations run on start.
    startCommand: node scripts/migrate.mjs && node api/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DICTIONARY_DB_POOL_SIZE
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: sino-db
          property: connectionString

databases:
  - name: sino-db
    plan: free
    region: frankfurt
    databaseName: sino
    user: sino
    postgresMajorVersion: "16"
    # Only the web service (private network) reaches the database.
    ipAllowList: []
